apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: idp-aiplane-langflow-postgres
  namespace: __TARGET_NAMESPACE__
spec:
  description: PostgreSQL for the Langflow mgmt-dev IDE
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: langflow
      owner: langflow
      dataChecksums: true
      encoding: UTF8
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
